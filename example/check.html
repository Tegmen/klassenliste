<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklisten Generator</title>
    <!-- PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* Allgemeine Stile */
        body {
            font-family: sans-serif;
            line-height: 1.5;
            margin: 2em;
        }
        h1 small {
            font-size: 0.5em;
            font-weight: normal;
            color: #555;
        }

        /* Stile für den Eingabebereich */
        .controls {
            margin-bottom: 2em;
            padding: 1.5em;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
        }

        .controls > div {
            margin-bottom: 1.5em;
        }
        
        .week-selectors {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        label {
            display: block;
            margin-bottom: 0.5em;
            font-weight: bold;
        }
        
        /* Kleinere Schrift für Wochen-Labels */
        .week-selectors label {
            font-size: 0.8em;
        }
        
        /* Mehr Abstand für den Wochen-Container */
        #wochentage-fields > div:last-child {
            margin-top: 2.5em;
        }

        input[type="text"], textarea, input[type="date"], select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            width: 95%;
            max-width: 500px;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        input[type="date"] {
             width: 200px;
        }

        button {
            padding: 10px 20px;
            font-size: 1em;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        
        /* Container for PDF content. Hidden from view but available for rendering. */
        #pdf-render-area {
            position: absolute;
            left: -9999px;
            top: auto;
            width: 1123px; /* A4 landscape width in pixels for rendering */
        }
        #pdf-content {
             background: white;
             padding: 20px;
        }

        /* Styles for the content inside the PDF render area */
        #pdf-content h2 {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 1em;
        }
        #pdf-content table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
            table-layout: fixed;
        }
        #pdf-content th, #pdf-content td {
            border: 1px solid #ddd;
            padding: 2px 8px;
            text-align: left;
            position: relative;
            height: 20px;
        }
        #pdf-content td:first-child {
            display: flex;
            align-items: center; /* Vertical centering for name */
        }
        /* Column widths */
        #pdf-content td:first-child, #pdf-content th:first-child { width: 135px; font-weight: bold; }
        #pdf-content th.date-header { width: 35px; }
        
        #pdf-content thead th.date-header {
            height: 85px;
            padding: 0;
        }
        /* Date alignment fix */
        #pdf-content thead th.date-header > span {
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-90deg);
            white-space: nowrap;
        }
        /* 3x higher header for empty lists */
        #pdf-content table.empty-list thead th {
             height: 60px; /* 3x the normal row height of 20px */
        }

        #pdf-content thead th:first-child {
            background-color: #fff;
            border: none;
        }
        #pdf-content tbody tr:nth-child(odd) { background-color: #e9e9e9; }
        #pdf-content tbody tr:nth-child(even) { background-color: #ffffff; }
        #pdf-content .week-separator { border-right: 3px solid #999; }
    </style>
</head>
<body>

    <h1>Checklisten Generator <small>(Martin Brändli 2025)</small></h1>

    <div class="controls">
        <div>
            <label for="title-input">Titel für die Liste:</label>
            <input type="text" id="title-input" value="Versäumnisse Klasse 3g">
        </div>
        <div>
            <label for="student-names">Namen (ein Name pro Zeile):</label>
            <textarea id="student-names">Anna
Berta
Claude
David
Emil
Frida
Gustav
Helena
Ida
Jakob
Klara
Leo
Marta
Noah
Olivia
Paul
Quentin
Rosa
Sofia
Theo
Ursula
Viktor
Wanda
Xaver
Yara
Zoe</textarea>
        </div>
        <div>
            <label for="list-type">Art der Liste:</label>
            <select id="list-type" onchange="toggleDateFields()">
                <option value="wochentage" selected>Mit Wochentagen</option>
                <option value="leer">Leere Spalten</option>
            </select>
        </div>
        <div id="wochentage-fields">
            <div>
                <label for="last-column-header">Titel für die letzte Spalte:</label>
                <input type="text" id="last-column-header" value="Arrest">
            </div>
            <div>
                <label>Wochen auswählen:</label>
                <div class="week-selectors">
                    <div><label for="week-1">1. Woche</label><input type="date" id="week-1"></div>
                    <div><label for="week-2">2. Woche</label><input type="date" id="week-2"></div>
                    <div><label for="week-3">3. Woche</label><input type="date" id="week-3"></div>
                    <div><label for="week-4">4. Woche</label><input type="date" id="week-4"></div>
                </div>
            </div>
        </div>
        <button id="generate-btn" onclick="generatePdf()">PDF erstellen</button>
    </div>

    <!-- This area is used to render the content before converting it to PDF -->
    <div id="pdf-render-area">
        <div id="pdf-content"></div>
    </div>

    <script>
        const { jsPDF } = window.jspdf;
        const weekPickers = [
            document.getElementById('week-1'),
            document.getElementById('week-2'),
            document.getElementById('week-3'),
            document.getElementById('week-4')
        ];

        function toggleDateFields() {
            const listType = document.getElementById('list-type').value;
            const fieldsContainer = document.getElementById('wochentage-fields');
            fieldsContainer.style.display = listType === 'wochentage' ? 'block' : 'none';
        }

        function updateFollowingWeeks(startIndex) {
            let baseDate = new Date(weekPickers[startIndex - 1].value);
            if (isNaN(baseDate.getTime())) return;

            for (let i = startIndex; i < weekPickers.length; i++) {
                baseDate.setDate(baseDate.getDate() + 7);
                weekPickers[i].valueAsDate = new Date(baseDate);
            }
        }

        weekPickers.forEach((picker, index) => {
            if (index < 3) {
                picker.addEventListener('change', () => updateFollowingWeeks(index + 1));
            }
        });
        
        document.addEventListener('DOMContentLoaded', () => {
            toggleDateFields();
            weekPickers[0].valueAsDate = new Date();
            updateFollowingWeeks(1);
        });

        function getMondayOfFirstWeek(dateString) {
            let date = new Date(dateString);
            const dayOfWeek = date.getDay();
            const difference = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
            date.setDate(date.getDate() + difference);
            return date;
        }
        
        function formatDateForFilename(date) {
            const year = date.getFullYear().toString().slice(-2);
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function generatePdf() {
            const generateBtn = document.getElementById('generate-btn');
            generateBtn.textContent = 'Generiere PDF...';
            generateBtn.disabled = true;
            
            const listType = document.getElementById('list-type').value;
            const title = document.getElementById('title-input').value;
            const studentNamesTextarea = document.getElementById('student-names');
            
            let students = studentNamesTextarea.value.split('\n').map(name => name.trim()).filter(name => name !== '');
            students.sort((a, b) => a.localeCompare(b, 'de', { sensitivity: 'base' }));
            studentNamesTextarea.value = students.join('\n');

            let headers = [];
            let lastColumnHeader = '';
            let weekSeparators = false;
            let tableClass = '';
            let filenameDate = formatDateForFilename(new Date());

            if (listType === 'wochentage') {
                lastColumnHeader = document.getElementById('last-column-header').value;
                weekSeparators = true;
                const weekStartInputs = weekPickers.map(picker => picker.value);
                if (weekStartInputs.some(date => !date)) {
                    alert("Bitte für alle vier Wochen ein Datum auswählen.");
                    generateBtn.textContent = 'PDF erstellen';
                    generateBtn.disabled = false;
                    return;
                }
                const weekDays = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
                weekStartInputs.forEach(startDateInput => {
                    let currentDate = getMondayOfFirstWeek(startDateInput);
                    for (let day = 0; day < 5; day++) {
                        headers.push(`${weekDays[currentDate.getDay()]} ${currentDate.getDate()}.${currentDate.getMonth() + 1}.`);
                        currentDate.setDate(currentDate.getDate() + 1);
                    }
                });
                const firstMonday = getMondayOfFirstWeek(weekStartInputs[0]);
                filenameDate = formatDateForFilename(firstMonday);

            } else { // "Leer"
                tableClass = 'empty-list';
                for (let i = 0; i < 20; i++) headers.push('');
            }
            
            const nameColumnSeparator = weekSeparators ? 'week-separator' : '';
            let contentHTML = `<h2>${title}</h2><table class="${tableClass}"><thead><tr><th class="${nameColumnSeparator}"></th>`;
            headers.forEach((header, index) => {
                const sepClass = weekSeparators && (index + 1) % 5 === 0 ? 'week-separator' : '';
                contentHTML += `<th class="date-header ${sepClass}"><span>${header}</span></th>`;
            });
            contentHTML += `<th>${lastColumnHeader}</th></tr></thead><tbody>`;
            students.forEach(student => {
                contentHTML += `<tr><td class="${nameColumnSeparator}">${student}</td>`;
                for (let i = 0; i < 20; i++) {
                    const sepClass = weekSeparators && (i + 1) % 5 === 0 ? 'week-separator' : '';
                    contentHTML += `<td class="${sepClass}"></td>`;
                }
                contentHTML += `<td></td></tr>`;
            });
            contentHTML += '</tbody></table>';

            const pdfContentEl = document.getElementById('pdf-content');
            pdfContentEl.innerHTML = contentHTML;

            try {
                const canvas = await html2canvas(pdfContentEl, { scale: 2, useCORS: true });
                const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
                
                const margin = 10; // 1cm = 10mm
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                const effectiveWidth = pageWidth - 2 * margin;
                const effectiveHeight = pageHeight - 2 * margin;

                const canvasWidth = canvas.width;
                const canvasHeight = canvas.height;
                const canvasRatio = canvasWidth / canvasHeight;

                // Scale to fit width, maintain aspect ratio
                let imgWidth = effectiveWidth;
                let imgHeight = imgWidth / canvasRatio;

                // If it's too tall for the page, scale it down to fit height
                if (imgHeight > effectiveHeight) {
                    imgHeight = effectiveHeight;
                    imgWidth = imgHeight * canvasRatio;
                }
                
                const x = margin + (effectiveWidth - imgWidth) / 2;
                const y = margin + (effectiveHeight - imgHeight) / 2;

                const imgData = canvas.toDataURL('image/png');
                pdf.addImage(imgData, 'PNG', x, y, imgWidth, imgHeight);
                
                const filename = `${title.replace(/ /g, '_')}_${filenameDate}.pdf`;
                pdf.save(filename);

            } catch (error) {
                console.error("Fehler bei der PDF-Erstellung:", error);
                alert("Ein Fehler ist aufgetreten. Bitte versuche es erneut.");
            } finally {
                generateBtn.textContent = 'PDF erstellen';
                generateBtn.disabled = false;
            }
        }
    </script>

</body>
</html>
